<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In · Villa-Reuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* Plain, distraction-free neutral background distinct from the home page */
    body.login-page-body {
      background-color: #f1f5f9;
      background-image: none;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      color: var(--c-text);
      box-sizing: border-box;
    }

    .login-portal-shell {
      width: 100%;
      max-width: 480px;
      padding: 32px 16px;
      margin: auto;
      box-sizing: border-box;
    }

    .login-brand-bar {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand-bar a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .login-brand-logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--c-green-600);
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.25);
    }

    .login-brand-title {
      display: block;
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--c-text);
      text-align: left;
    }

    .login-brand-tagline {
      display: block;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--c-muted);
      font-weight: 600;
      text-align: left;
    }

    .login-portal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 36px 36px 32px;
      width: 100%;
      box-sizing: border-box;
    }

    .login-portal-head {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #dcfce7;
      color: #166534;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .login-welcome-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      color: #0f172a;
      margin: 0 0 8px;
      line-height: 1.25;
    }

    .login-welcome-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0;
      line-height: 1.5;
    }

    .login-alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
      display: none;
    }

    .login-alert--error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .login-alert--success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field__label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .login-field__label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .login-field__forgot {
      background: none;
      border: none;
      color: var(--c-green-800);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .login-field__forgot:hover {
      color: var(--c-green-900);
    }

    .login-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--c-green-600);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    .login-password-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-password-box .login-input {
      padding-right: 42px;
    }

    .login-toggle-pass {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 6px;
      border-radius: 4px;
    }

    .login-toggle-pass:hover {
      color: #0f172a;
    }

    .login-btn-submit {
      margin-top: 6px;
      height: 44px;
      background: var(--c-green-700);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s, transform 0.1s;
    }

    .login-btn-submit:hover:not(:disabled) {
      background: var(--c-green-800);
    }

    .login-btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Demo User Section */
    .login-demo-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .login-demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .login-demo-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      margin: 0;
    }

    .login-demo-hint {
      font-size: 11px;
      color: #94a3b8;
    }

    .login-demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .demo-user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .demo-user-pill:hover {
      border-color: var(--c-green-500);
      background: #f0fdf4;
      transform: translateY(-1px);
    }

    .demo-user-pill--active {
      border-color: var(--c-green-600);
      background: #dcfce7;
    }

    .demo-user-pill__icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .demo-user-pill__name {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
      display: block;
    }

    .demo-user-pill__role {
      font-size: 10px;
      color: #64748b;
      line-height: 1.2;
      display: block;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-footer-links a {
      color: var(--c-green-800);
      font-weight: 600;
      text-decoration: none;
    }

    .login-footer-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-portal-card {
        padding: 24px 20px;
      }
      .login-demo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="login-page-body">
  <div class="login-portal-shell">
    <!-- Brand Header -->
    <div class="login-brand-bar">
      <a href="index.html">
        <span class="login-brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z" />
            <path d="M5 19l7-7" />
          </svg>
        </span>
        <div>
          <span class="login-brand-title">Villa-Reuse</span>
          <span class="login-brand-tagline">GIVE WELL. LIVE LIGHTER.</span>
        </div>
      </a>
    </div>

    <!-- Centered Sign In Portal Card -->
    <main class="login-portal-card">
      <div class="login-portal-head">
        <span class="login-badge">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Community Portal
        </span>
        <h1 class="login-welcome-title">Welcome to Villa-Reuse</h1>
        <p class="login-welcome-subtitle">Give well. Live lighter. Sign in to your community exchange account.</p>
      </div>

      <div id="login-alert" class="login-alert" role="alert"></div>

      <!-- Exactly 2 Inputs Form: Email, Password -->
      <form id="login-form" class="login-form" novalidate>
        <!-- Input 1: Email -->
        <div class="login-field">
          <div class="login-field__label-row">
            <label class="login-field__label" for="login-email">Email Address <span style="color:#b23b2e;">*</span></label>
          </div>
          <input
            class="login-input"
            id="login-email"
            type="email"
            autocomplete="email"
            required
            placeholder="e.g. member@villareuse.org"
          />
        </div>

        <!-- Input 2: Password + Forgot password link -->
        <div class="login-field">
          <div class="login-field__label-row">
            <label class="login-field__label" for="login-password">Password <span style="color:#b23b2e;">*</span></label>
            <button class="login-field__forgot" type="button" id="forgot-password-link">Forgot password?</button>
          </div>
          <div class="login-password-box">
            <input
              class="login-input"
              id="login-password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
            />
            <button class="login-toggle-pass" type="button" id="toggle-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button class="login-btn-submit" type="submit" id="submit-login-btn">
          Sign In
        </button>
      </form>

      <!-- Demo User Quick Select Section -->
      <div class="login-demo-section">
        <div class="login-demo-header">
          <h2 class="login-demo-title">Demo User Instant Fill</h2>
          <span class="login-demo-hint">1-click select</span>
        </div>
        <div class="login-demo-grid">
          <!-- Demo 1: Member -->
          <button type="button" class="demo-user-pill" data-demo-role="member" id="demo-member-btn">
            <span class="demo-user-pill__icon" style="background:#dcfce7; color:#166534;">JL</span>
            <div>
              <span class="demo-user-pill__name">Jordan Lee</span>
              <span class="demo-user-pill__role">Member</span>
            </div>
          </button>

          <!-- Demo 2: Donor -->
          <button type="button" class="demo-user-pill" data-demo-role="donor" id="demo-donor-btn">
            <span class="demo-user-pill__icon" style="background:#fef9c3; color:#854d0e;">MS</span>
            <div>
              <span class="demo-user-pill__name">Maria Santos</span>
              <span class="demo-user-pill__role">Item Donor</span>
            </div>
          </button>

          <!-- Demo 3: Moderator -->
          <button type="button" class="demo-user-pill" data-demo-role="moderator" id="demo-moderator-btn">
            <span class="demo-user-pill__icon" style="background:#ede9fe; color:#5b21b6;">AC</span>
            <div>
              <span class="demo-user-pill__name">Alex Chen</span>
              <span class="demo-user-pill__role">Moderator</span>
            </div>
          </button>

          <!-- Demo 4: Admin -->
          <button type="button" class="demo-user-pill" data-demo-role="admin" id="demo-admin-btn">
            <span class="demo-user-pill__icon" style="background:#e0e7ff; color:#3730a3;">SP</span>
            <div>
              <span class="demo-user-pill__name">Samira Patel</span>
              <span class="demo-user-pill__role">Admin</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Footer Navigation Links -->
      <div class="login-footer-links">
        <div>
          Don't have an account? <a href="signup.html">Create an Account / Demo Users &rarr;</a>
        </div>
        <div>
          <a href="index.html" style="font-size:12px; color:#64748b;">&larr; Back to Marketplace Home</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="dist/login.js"></script>
</body>
</html>
